<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Candy Saga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            background-color: var(--tg-theme-bg-color, #2c3e50);
            color: var(--tg-theme-text-color, #ffffff);
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Smooth fade transitions */
        .screen {
            transition: opacity 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        
        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-push {
            transition: transform 0.1s;
        }
        .btn-push:active {
            transform: scale(0.95);
        }

        #game-canvas {
            display: block;
            margin: 0 auto;
            touch-action: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "canvas-confetti": "https://aistudiocdn.com/canvas-confetti@^1.9.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="h-screen w-screen relative bg-gradient-to-b from-purple-900 to-indigo-900">

    <!-- Loading Screen -->
    <div id="screen-loading" class="screen active justify-center items-center z-50 bg-slate-900">
        <div class="text-4xl font-bold animate-bounce text-yellow-400">Loading...</div>
    </div>

    <!-- Main Menu -->
    <div id="screen-menu" class="screen justify-center items-center p-4">
        <h1 class="text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-pink-500 mb-8 drop-shadow-lg">
            Candy<br>Saga
        </h1>
        
        <div class="w-full max-w-xs space-y-4">
            <button id="btn-play" class="btn-push w-full py-4 rounded-2xl bg-gradient-to-r from-green-400 to-green-600 text-white text-2xl font-bold shadow-lg shadow-green-900/50">
                PLAY
            </button>
            <div class="grid grid-cols-2 gap-4">
                 <button id="btn-leaderboard" class="btn-push py-3 rounded-xl bg-blue-500 text-white font-bold shadow-lg">
                    🏆 Top 50
                </button>
                <button id="btn-settings" class="btn-push py-3 rounded-xl bg-orange-500 text-white font-bold shadow-lg">
                    ⚙️ Settings
                </button>
            </div>
            <div class="glass rounded-xl p-4 text-center mt-6">
                <p class="text-sm text-gray-300">Total Stars</p>
                <p id="total-stars-display" class="text-3xl font-bold text-yellow-300">0 / 45</p>
            </div>
        </div>
    </div>

    <!-- Level Selector -->
    <div id="screen-levels" class="screen p-4 overflow-y-auto pt-20 pb-10">
        <h2 class="text-3xl font-bold text-center mb-6">Select Level</h2>
        <div id="levels-grid" class="grid grid-cols-4 gap-3 max-w-md mx-auto">
            <!-- Injected via JS -->
        </div>
    </div>

    <!-- Game HUD -->
    <div id="screen-game" class="screen">
        <!-- Top Bar -->
        <div class="absolute top-0 w-full h-24 glass z-20 flex justify-between items-end pb-2 px-4">
            <div class="flex flex-col items-center w-20">
                <span class="text-xs text-gray-300">MOVES</span>
                <span id="hud-moves" class="text-3xl font-bold text-white">0</span>
            </div>
            <div class="flex flex-col items-center flex-1">
                <span class="text-xs text-yellow-300 font-bold mb-1">SCORE</span>
                <div class="w-full h-4 bg-gray-700 rounded-full overflow-hidden relative border border-gray-500">
                    <div id="hud-progress-fill" class="h-full bg-gradient-to-r from-orange-400 to-yellow-500 w-0 transition-all duration-500"></div>
                </div>
                <span id="hud-score" class="text-lg font-bold mt-1">0</span>
            </div>
            <div class="flex flex-col items-center w-20">
                <span class="text-xs text-gray-300">TARGET</span>
                <span id="hud-target" class="text-xl font-bold text-green-300">0</span>
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="flex-1 flex items-center justify-center relative w-full h-full">
            <canvas id="game-canvas"></canvas>
            <div id="floating-texts" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="modal-gameover" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white text-gray-900 w-11/12 max-w-sm rounded-3xl p-6 text-center transform scale-90 transition-transform duration-300 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-blue-400 to-transparent -z-10"></div>
            
            <h2 id="go-title" class="text-4xl font-black text-blue-600 mb-2 mt-4">LEVEL COMPLETED</h2>
            
            <div class="flex justify-center gap-2 my-4 text-5xl">
                <span id="star-1" class="text-gray-300 transition-colors duration-500">★</span>
                <span id="star-2" class="text-gray-300 transition-colors duration-500 delay-200">★</span>
                <span id="star-3" class="text-gray-300 transition-colors duration-500 delay-500">★</span>
            </div>

            <p id="go-score" class="text-2xl font-bold text-gray-700">Score: 12,450</p>
            
            <div class="grid grid-cols-2 gap-3 mt-8">
                <button id="btn-home" class="py-3 rounded-xl bg-gray-200 font-bold text-gray-700">Menu</button>
                <button id="btn-next" class="py-3 rounded-xl bg-green-500 font-bold text-white shadow-lg shadow-green-500/40">Next Level</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
