<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Eliezer Rush</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              game: {
                bg: '#2c1b4e',
                panel: 'rgba(255, 255, 255, 0.1)',
                accent: '#ff0080'
              }
            },
            animation: {
              'bounce-short': 'bounce 0.3s infinite',
              'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'pop': 'pop 0.3s ease-out forwards',
              'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
              'particle': 'particles 0.8s ease-out forwards',
              'confetti': 'confetti 3s ease-in-out infinite',
              'bounce-in': 'bounce-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'shimmer-sweep': 'shimmer-sweep 1s cubic-bezier(0.4, 0, 0.2, 1) forwards',
              'settle': 'settle 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)',
              'spin-slow': 'spin 3s linear infinite'
            },
            keyframes: {
              pop: {
                '0%': { transform: 'scale(0.5)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' }
              },
              shake: {
                '0%, 100%': { transform: 'translate3d(0, 0, 0)' },
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
              },
              particles: {
                '0%': { transform: 'translate(0, 0) scale(1)', opacity: '1' },
                '100%': { transform: 'translate(var(--tx), var(--ty)) scale(0)', opacity: '0' }
              },
              confetti: {
                '0%': { transform: 'translateY(-10vh) rotate(0deg)', opacity: '1' },
                '100%': { transform: 'translateY(110vh) rotate(720deg)', opacity: '0' }
              },
              'bounce-in': {
                '0%': { transform: 'scale(0)', opacity: '0' },
                '60%': { transform: 'scale(1.15)', opacity: '1' },
                '100%': { transform: 'scale(1)', opacity: '1' }
              },
              'shimmer-sweep': {
                '0%': { transform: 'translateX(-100%) skewX(-20deg)', opacity: '0' },
                '10%': { opacity: '1' },
                '100%': { transform: 'translateX(200%) skewX(-20deg)', opacity: '0' }
              },
              settle: {
                '0%': { transform: 'scale(1.05) translateY(-5%)' },
                '50%': { transform: 'scale(0.9) translateY(2%)' },
                '100%': { transform: 'scale(0.95) translateY(0)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #1a103c 0%, #4a1f64 100%);
        touch-action: none; /* Prevent pull-to-refresh on mobile */
        overflow: hidden;
      }
      .candy-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px;
        width: 100%;
        max-width: 400px;
        aspect-ratio: 1;
      }
      /* Glassmorphism utilities */
      .glass {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.454.0?external=react,react-dom",
    "@tonconnect/ui-react": "https://esm.sh/@tonconnect/ui-react@2.0.0?external=react,react-dom",
    "@tonconnect/sdk": "https://esm.sh/@tonconnect/sdk@3.0.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="text-white antialiased h-screen flex flex-col items-center justify-center">
    <div id="root" class="w-full h-full flex flex-col"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
