<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tap Coin Miner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://telegram.adsgram.ai/js/adgram-sdk.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
      body {
        overscroll-behavior-y: contain;
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 and IE 11 */
        user-select: none; /* Standard syntax */
      }
      @keyframes fade-up {
        from {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        to {
          opacity: 0;
          transform: translateY(-80px) scale(1.5);
        }
      }
      .animate-fade-up {
        animation: fade-up 1s ease-out forwards;
      }
      @keyframes pulse-glow {
        0%, 100% {
          box-shadow: 0 0 2px #fde047, 0 0 5px #f97316, 0 0 10px #f97316;
        }
        50% {
          box-shadow: 0 0 5px #fde047, 0 0 10px #f97316, 0 0 15px #ef4444;
        }
      }
      .animate-pulse-glow {
        animation: pulse-glow 2.5s infinite ease-in-out;
      }
      @keyframes pulse-glow-turbo {
        0%, 100% {
          box-shadow: 0 0 10px #fef08a, 0 0 25px #f97316, 0 0 40px #f97316;
        }
        50% {
          box-shadow: 0 0 20px #fef08a, 0 0 40px #f97316, 0 0 60px #ef4444;
        }
      }
      .animate-pulse-glow-turbo {
        animation: pulse-glow-turbo 1.2s infinite ease-in-out;
      }
      @keyframes pulse-glow-green {
        0%, 100% {
          box-shadow: 0 0 3px #4ade80, 0 0 6px #22c55e, 0 0 12px #16a34a;
        }
        50% {
          box-shadow: 0 0 6px #4ade80, 0 0 12px #22c55e, 0 0 18px #15803d;
        }
      }
      .animate-pulse-glow-green {
        animation: pulse-glow-green 2s infinite ease-in-out;
      }

      @keyframes pulse-glow-cyan {
        0%, 100% {
          box-shadow: 0 0 3px #67e8f9, 0 0 6px #22d3ee, 0 0 12px #06b6d4;
        }
        50% {
          box-shadow: 0 0 6px #67e8f9, 0 0 12px #22d3ee, 0 0 18px #0891b2;
        }
      }
      .animate-pulse-glow-cyan {
        animation: pulse-glow-cyan 2s infinite ease-in-out;
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }

      /* Tap and Score Animations */
      @keyframes coin-tap {
        0% { transform: scale(1); }
        50% { transform: scale(0.92); }
        100% { transform: scale(1); }
      }
      .animate-coin-tap {
        animation: coin-tap 0.1s ease-in-out;
      }
      @keyframes score-pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); color: #ffffff; text-shadow: 0 0 10px #fef08a; }
        100% { transform: scale(1); }
      }
      .animate-score-pulse {
        animation: score-pulse 0.2s ease-out;
      }

      /* Spin Wheel Styles */
      .wheel-container {
        position: relative;
        width: 250px;
        height: 250px;
        margin: 20px auto;
      }

      .wheel {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        position: relative;
        overflow: hidden;
        border: 8px solid #fde047;
        transition: transform 5s cubic-bezier(0.25, 1, 0.5, 1);
        background: conic-gradient(
          #4f46e5 0deg 45deg,
          #14b8a6 45deg 90deg,
          #d97706 90deg 135deg,
          #db2777 135deg 180deg,
          #4f46e5 180deg 225deg,
          #14b8a6 225deg 270deg,
          #d97706 270deg 315deg,
          #db2777 315deg 360deg
        );
      }

      .wheel-pointer {
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-top: 30px solid #ef4444; /* Red pointer */
        z-index: 10;
        filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
      }

      .wheel-center {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 40px;
          height: 40px;
          background: #fde047;
          border-radius: 50%;
          border: 5px solid #b45309;
          z-index: 11;
      }

      .wheel-label {
        position: absolute;
        font-weight: bold;
        color: white;
        font-size: 0.7rem;
        text-shadow: 1px 1px 3px #000;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }
    </style>

{

    "react/": "https://esm.sh/react@18.3.1/",

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

  </body>
</html>
