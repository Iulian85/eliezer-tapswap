
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tap Coin Miner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        overscroll-behavior-y: contain;
        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 and IE 11 */
        user-select: none; /* Standard syntax */
      }
      @keyframes fade-up {
        from {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        to {
          opacity: 0;
          transform: translateY(-80px) scale(1.5);
        }
      }
      .animate-fade-up {
        animation: fade-up 1s ease-out forwards;
      }
      @keyframes pulse-glow {
        0%, 100% {
          box-shadow: 0 0 2px #fde047, 0 0 5px #f97316, 0 0 10px #f97316;
        }
        50% {
          box-shadow: 0 0 5px #fde047, 0 0 10px #f97316, 0 0 15px #ef4444;
        }
      }
      .animate-pulse-glow {
        animation: pulse-glow 2.5s infinite ease-in-out;
      }
      @keyframes pulse-glow-turbo {
        0%, 100% {
          box-shadow: 0 0 10px #fef08a, 0 0 25px #f97316, 0 0 40px #f97316;
        }
        50% {
          box-shadow: 0 0 20px #fef08a, 0 0 40px #f97316, 0 0 60px #ef4444;
        }
      }
      .animate-pulse-glow-turbo {
        animation: pulse-glow-turbo 1.2s infinite ease-in-out;
      }
      @keyframes pulse-glow-green {
        0%, 100% {
          box-shadow: 0 0 3px #4ade80, 0 0 6px #22c55e, 0 0 12px #16a34a;
        }
        50% {
          box-shadow: 0 0 6px #4ade80, 0 0 12px #22c55e, 0 0 18px #15803d;
        }
      }
      .animate-pulse-glow-green {
        animation: pulse-glow-green 2s infinite ease-in-out;
      }
    </style>
